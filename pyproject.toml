[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-mix-sync"
version = "0.1.0"
description = "Personal tool: recreate Spotify Daily Mix playlists in Apple Music from track metadata."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
daily-mix-sync = "daily_mix_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "music_app: drives the real Music app on this Mac; only run with --music-app",
]
